<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦀 Crear pieza — Cluster TXURTXIL</title>
<style>
  :root { --bg:#12100e; --panel:#1e1a17; --accent:#e8722a; --ok:#3ddc84; --warn:#ffcc00; --bad:#ff5252; --txt:#e8e2da; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 1.15rem; color: var(--accent); margin: 4px 0 4px; }
  .sub { font-size: .78rem; opacity: .7; margin-bottom: 10px; }
  .panel { background: var(--panel); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  label { font-size: .8rem; opacity: .8; display: block; margin: 6px 0 2px; }
  input, textarea, select { width: 100%; background: #2a2521; color: var(--txt); border: 1px solid #444; border-radius: 6px; padding: 8px; font-size: .95rem; }
  textarea { min-height: 90px; resize: vertical; }
  button { background: var(--accent); color: #1a120b; font-weight: bold; border: none; border-radius: 8px; padding: 12px 16px; margin: 8px 4px 0 0; font-size: 1rem; }
  button.sec { background: #4a423c; color: var(--txt); font-size: .85rem; padding: 8px 12px; }
  button:disabled { opacity: .4; }
  pre { background: #0a0908; border-radius: 6px; padding: 8px; font-size: .72rem; overflow-x: auto; white-space: pre-wrap; max-height: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: .75rem; margin-top: 8px; }
  td, th { border-bottom: 1px solid #3a332e; padding: 4px 6px; text-align: left; word-break: break-all; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .75rem; font-weight: bold; }
  .pill.RUNNING { background: #4a423c; } .pill.DONE { background: #1b5e20; } .pill.FAILED { background: #7a1010; }
  details { margin-top: 10px; font-size: .8rem; opacity: .85; }
  #photoBtn { display: block; border: 1px dashed #666; border-radius: 8px; padding: 14px; text-align: center; cursor: pointer; opacity: .85; margin-top: 4px; }
  #photoBtn.has { border-color: var(--ok); color: var(--ok); opacity: 1; }
</style>
</head>
<body>
<h1>🦀 Crear pieza</h1>
<div class="sub">prompt → Qwen3-Coder escribe bpy → Blender construye → métricas deciden → STL</div>

<div class="panel">
  <label>Cluster (rpi5):</label>
  <input type="text" id="clusterUrl" placeholder="http://192.168.10.140:8200">
</div>

<div class="panel">
  <label>🧩 Plantilla (opcional):</label>
  <select id="tplSel"><option value="">— empezar de cero —</option></select>
  <label>📷 Foto de referencia (opcional — la analiza Qwen3-VL):</label>
  <input type="file" id="photo" accept="image/*" style="display:none">
  <span id="photoBtn" onclick="document.getElementById('photo').click()">📷 Toca para elegir foto</span>
  <label>Describe la pieza (medidas en mm, uso, agujeros...):</label>
  <textarea id="prompt" placeholder="soporte angular de 40x20x3mm con agujero de 8mm para tornillo M8"></textarea>
  <button id="btnGo" onclick="crearPieza()">⚡ CREAR PIEZA</button>
  <div id="out"></div>
</div>

<div class="panel">
  <div id="statusBox">—</div>
</div>

<div class="panel">
  <div id="artsBox">—</div>
</div>

<details>
  <summary>⚙️ Avanzado (editar generador, lanzar a mano, otras piezas)</summary>
  <div class="panel" style="margin-top:8px">
    <label>Generadores del cluster:</label>
    <select id="gensSel" onchange="if(this.value){document.getElementById('genName').value=this.value;document.getElementById('genBox').style.display='none'}"><option value="">— elegir —</option></select>
    <label>gen a lanzar:</label>
    <input type="text" id="genName" placeholder="gen_petrolero_v3.py">
    <label>run:</label>
    <input type="text" id="runName" placeholder="petrolero_v3">
    <div id="genBox" style="display:none">
      <label>gen_<span id="genSlug"></span>.py (editable):</label>
      <textarea id="genCode" style="min-height:180px;font-family:monospace;font-size:.72rem"></textarea>
    </div>
    <label>pregunta del juez VLM:</label>
    <input type="text" id="ask" value="Describe la pieza renderizada: forma, color y detalles. Una frase.">
    <button class="sec" onclick="writeGen()">✍️ Solo escribir generador (Coder)</button>
    <button class="sec" onclick="launchManual()">🚀 Solo lanzar misión</button>
    <button class="sec" onclick="loadGens()">📋 Recargar generadores</button>
  </div>
</details>

<script>
const $ = id => document.getElementById(id);
let poller = null, currentB64 = null, currentMime = null;

const TEMPLATES = [
  ["🚢 Petrolero v3 — 533 piezas (casco por estaciones)", "gen_petrolero_v3.py", "petrolero_v3", "Petrolero completo v3"],
  ["🖥️ Chasis BC-250", "gen_chasis.py", "chasis_bc250", "Chasis para placa BC-250"],
  ["⚙️ Soporte angular M8 (verificado)", "gen_bracket.py", "bracket_m8_v1", "Soporte angular 40x20x3mm, agujero Ø8mm"],
  ["🗼 Torre Eiffel", "gen_eiffel.py", "eiffel_v1", "Torre Eiffel parametrica"],
  ["🚀 Cohete estilo Falcon", "gen_cohete_estilo_falcon.py", "falcon_v1", "Cohete reutilizable estilo Falcon"],
  ["🌀 Tapa ventilador", "gen_tapa_ventilador.py", "tapa_fan_v1", "Tapa de ventilador"],
  ["🖼️ Moldura", "gen_moldura.py", "moldura_v1", "Moldura decorativa"]
];

function cfg() {
  return { url: ($('clusterUrl').value.trim() || 'http://192.168.10.140:8200').replace(/\/$/, '') };
}
async function api(path, body) {
  const res = await fetch(cfg().url + path, { method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}
function slug(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 48); }
function log(msg, cls) { $('out').innerHTML = '<div class="' + (cls || '') + '" style="margin-top:8px;font-size:.85rem">' + msg + '</div>'; }

$('photo').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  currentMime = f.type || 'image/jpeg';
  const buf = await f.arrayBuffer();
  let bin = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  currentB64 = btoa(bin);
  $('photoBtn').textContent = '📷 ' + f.name + ' (' + Math.round(f.size/1024) + ' KB) — lista';
  $('photoBtn').classList.add('has');
});

$('tplSel').addEventListener('change', () => {
  const t = TEMPLATES[$('tplSel').selectedIndex - 1];
  if (!t) return;
  $('genName').value = t[1]; $('runName').value = t[2]; $('prompt').value = t[3];
  $('gensSel').value = t[1];
});

async function crearPieza() {
  const btn = $('btnGo'); btn.disabled = true;
  try {
    let prompt = $('prompt').value.trim();
    const hasTpl = $('tplSel').selectedIndex > 0;
    // 0) plantilla existente -> lanzar directo
    if (hasTpl && $('genName').value) {
      log('🧩 Plantilla <b>' + $('genName').value + '</b> → lanzando…');
      await doLaunch($('runName').value, $('genName').value, null);
      return;
    }
    // 1) foto -> VLM describe
    if (currentB64 && !prompt) {
      log('👁️ Qwen3-VL analizando la foto…');
      const d = await api('/vlm/ask', { image_b64: currentB64, mime: currentMime,
        prompt: 'Describe esta pieza para replicarla en CAD: forma, medidas aproximadas, agujeros, uso. En espanol, conciso.' });
      prompt = d.answer.trim();
      $('prompt').value = prompt;
      log('👁️ VLM: ' + prompt.slice(0, 160) + '…');
    }
    if (!prompt) throw new Error('Escribe un prompt o sube una foto.');
    // 2) Coder escribe el generador
    const name = $('runName').value.trim() || slug(prompt).slice(0, 40) || ('pieza_' + Date.now());
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(name)) throw new Error('Nombre de run invalido: ' + name);
    const gen = 'gen_' + name + '.py';
    log('🧠 Qwen3-Coder escribiendo <b>' + gen + '</b>…');
    const system = 'Eres un ingeniero bpy experto del cluster TXURTXIL. Escribe un generador Python para Blender headless con ESTE CONTRATO: ' +
      '1) diccionario P con todos los parametros en mm (1 BU = 1 mm), 2) limpiar la escena, 3) construir la pieza con primitivas bpy, 4) aplicar transforms, ' +
      '5) guardar con bpy.ops.wm.save_as_mainfile(filepath=sys.argv[sys.argv.index("--")+1]), 6) imprimir GEN_OK al final. ' +
      'Responde UNICAMENTE con el codigo python, sin markdown.';
    const d = await api('/coder/ask', { system, prompt, json_mode: false });
    const genCode = d.answer.replace(/```python|```/g, '').trim();
    $('genCode').value = genCode; $('genSlug').textContent = name;
    log('🧠 Generador listo (' + genCode.length + ' chars) → lanzando misión…', 'ok');
    // 3) lanzar + vigilar
    await doLaunch(name, gen, genCode);
  } catch (e) {
    log('❌ ' + e.message, 'bad');
  }
  btn.disabled = false;
}

async function doLaunch(name, gen, genCode) {
  const body = { name, gen, ask: $('ask').value.trim() };
  if (genCode) body.gen_code = genCode;
  const d = await api('/mission', body);
  log('🚀 Misión <b>' + d.run_id + '</b> en marcha (Blender z1 → render → juez VLM)', 'ok');
  watchRun(d.run_id);
}

async function watchRun(runId) {
  if (poller) clearInterval(poller);
  const tick = async () => {
    try {
      const st = await api('/mission/' + runId);
      let html = '<span class="pill ' + st.status + '">' + st.status + '</span> <b>' + runId + '</b>';
      if (st.exitcode !== undefined) html += ' · exitcode ' + st.exitcode;
      html += '<br><small>' + (st.log_tail || '').split('\n').slice(-2).join(' ').slice(-160) + '</small>';
      $('statusBox').innerHTML = html;
      if (st.status === 'DONE' || st.status === 'FAILED') {
        stopPoll();
        if (st.status === 'DONE') { log('✅ Pieza construida — descarga tus archivos:', 'ok'); loadArts(runId); }
        else log('❌ Misión fallida — revisa el log en Avanzado', 'bad');
      }
    } catch (e) { $('statusBox').innerHTML = '<span class="bad">❌ ' + e.message + '</span>'; }
  };
  tick(); poller = setInterval(tick, 5000);
}
function stopPoll() { if (poller) { clearInterval(poller); poller = null; } }

async function loadArts(runId) {
  try {
    const d = await api('/artifacts/' + runId);
    let html = '<table><tr><th>archivo</th><th>tamaño</th><th></th></tr>';
    for (const a of d.artifacts) {
      html += '<tr><td>' + a.file + '</td><td>' + a.size + '</td>' +
              '<td><button class="sec" onclick="dl(\'' + runId + '\',\'' + a.file + '\',\'' + a.sha256 + '\')">⬇ sha256✓</button></td></tr>';
    }
    $('artsBox').innerHTML = html + '</table>';
  } catch (e) { $('artsBox').innerHTML = '<span class="bad">❌ ' + e.message + '</span>'; }
}
async function dl(runId, file, expectSha) {
  try {
    const res = await fetch(cfg().url + '/artifacts/' + runId + '/' + file);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    const hash = await crypto.subtle.digest('SHA-256', buf);
    const sha = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    if (sha !== expectSha) throw new Error('sha256 NO coincide');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf])); a.download = runId + '_' + file; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { alert('❌ ' + e.message); }
}

async function writeGen() {
  try {
    const name = $('runName').value.trim(); const s = slug(name);
    $('genSlug').textContent = s; $('genName').value = 'gen_' + s + '.py';
    const system = 'Eres un ingeniero bpy experto. Contrato: P dict en mm (1 BU = 1 mm), limpiar escena, primitivas bpy, transforms aplicadas, save_as_mainfile con sys.argv[sys.argv.index("--")+1], imprimir GEN_OK. Solo codigo python.';
    const d = await api('/coder/ask', { system, prompt: $('prompt').value.trim(), json_mode: false });
    $('genCode').value = d.answer.replace(/```python|```/g, '').trim();
    $('genBox').style.display = 'block';
  } catch (e) { alert('❌ ' + e.message); }
}
async function launchManual() {
  try {
    const body = { name: $('runName').value.trim(), gen: $('genName').value.trim(), ask: $('ask').value.trim() };
    if ($('genCode').value.trim() && $('genBox').style.display !== 'none') body.gen_code = $('genCode').value;
    await doLaunch(body.name, body.gen, body.gen_code || null);
  } catch (e) { alert('❌ ' + e.message); }
}
async function loadGens() {
  try {
    const gens = await api('/gens');
    $('gensSel').innerHTML = '<option value="">— elegir —</option>' + gens.map(g => '<option value="' + g + '">' + g + '</option>').join('');
  } catch (e) { alert('❌ ' + e.message); }
}

// init
$('clusterUrl').value = localStorage.getItem('nexus_cluster_url') || '';
if (!$('clusterUrl').value) $('clusterUrl').value = 'http://192.168.10.140:8200';
$('tplSel').innerHTML = '<option value="">— empezar de cero —</option>' +
  TEMPLATES.map((t, i) => '<option value="' + i + '">' + t[0] + '</option>').join('');
loadGens();
</script>
</body>
</html>
